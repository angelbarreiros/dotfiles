<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Keep the normal system and user font configuration. -->
  <include>/etc/fonts/fonts.conf</include>
  <include ignore_missing="yes">/home/demper/.config/fontconfig/fonts.conf</include>

  <!-- AbiWord cannot reliably render the installed color emoji font. -->
  <dir>/home/demper/.config/abiword/fonts</dir>

  <!-- Prefer the compatible outline font only for emoji-shaped text. -->
  <alias binding="same">
    <family>emoji</family>
    <prefer>
      <family>Noto Emoji</family>
    </prefer>
  </alias>

  <!-- Redirect explicit color-emoji requests made by imported documents. -->
  <alias binding="same">
    <family>Noto Color Emoji</family>
    <prefer>
      <family>Noto Emoji</family>
    </prefer>
  </alias>
</fontconfig>
